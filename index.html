<!DOCTYPE html>

<html lang="nl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kenteken Tijd</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  background:#f2f2f7;

  color:#111;

}

header{

  background:#111;

  color:white;

  padding:28px 20px 22px;

  text-align:center;

}

h1{

  margin:0;

  font-size:28px;

}

.container{

  padding:20px;

  max-width:600px;

  margin:auto;

}

.card{

  background:white;

  border-radius:18px;

  padding:20px;

  margin-bottom:18px;

  box-shadow:0 2px 8px #00000012;

}

label{

  font-weight:600;

  display:block;

  margin-bottom:8px;

}

input{

  width:100%;

  padding:15px;

  font-size:20px;

  border:1px solid #ccc;

  border-radius:12px;

  margin-bottom:12px;

  text-transform:uppercase;

}

button{

  width:100%;

  border:0;

  border-radius:14px;

  padding:15px;

  font-size:18px;

  font-weight:700;

  margin-top:8px;

}

.start{

  background:#16883e;

  color:white;

}

.pause{

  background:#f0a000;

  color:white;

}

.stop{

  background:#d93025;

  color:white;

}

.resume{

  background:#16883e;

  color:white;

}

.secondary{

  background:#e5e5ea;

  color:#111;

}

.timer{

  text-align:center;

  font-size:38px;

  font-weight:700;

  margin:12px 0;

}

.status{

  text-align:center;

  font-weight:600;

  margin-bottom:8px;

}

.active-title{

  font-size:21px;

  font-weight:700;

}

.job{

  border-top:1px solid #ddd;

  padding:16px 0;

}

.job:first-child{

  border-top:0;

}

.small{

  color:#666;

  font-size:14px;

}

.history-item{

  border-top:1px solid #ddd;

  padding:14px 0;

}

.history-item:first-child{

  border-top:0;

}

.empty{

  text-align:center;

  color:#777;

  padding:10px;

}

.job-buttons{

  display:flex;

  gap:8px;

}

.job-buttons button{

  flex:1;

}

/* =========================

   NEDERLANDSE KENTEKENPLAAT

   ========================= */

.plate{

  display:inline-flex;

  align-items:center;

  height:58px;

  min-width:205px;

  background:#ffd900;

  border:3px solid #111;

  border-radius:8px;

  overflow:hidden;

  box-shadow:

    0 2px 4px #00000030,

    inset 0 0 0 1px #ffffff55;

  font-family:Arial,Helvetica,sans-serif;

  font-weight:900;

  color:#050505;

}

.plate-nl{

  width:34px;

  height:100%;

  background:#1559a6;

  color:white;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  font-size:13px;

  line-height:15px;

  flex-shrink:0;

}

.plate-eu{

  font-size:13px;

  line-height:12px;

}

.plate-text{

  flex:1;

  text-align:center;

  font-size:29px;

  letter-spacing:2px;

  padding:0 8px;

  white-space:nowrap;

}

.active-plate{

  margin:0 auto 8px;

  width:max-content;

  max-width:100%;

}

.history-plate{

  height:43px;

  min-width:155px;

  border-width:2px;

  border-radius:6px;

  margin-bottom:6px;

}

.history-plate .plate-nl{

  width:27px;

  font-size:10px;

  line-height:10px;

}

.history-plate .plate-eu{

  font-size:10px;

  line-height:9px;

}

.history-plate .plate-text{

  font-size:21px;

  letter-spacing:1.5px;

}

@media(max-width:420px){

  .job-buttons{

    flex-direction:column;

  }

  .plate{

    height:52px;

    min-width:185px;

  }

  .plate-text{

    font-size:25px;

  }

}

</style>

</head>

<body>

<header>

  <h1>🚗 Kenteken Tijd</h1>

</header>

<div class="container">

  <div class="card">

    <label>Nieuw kenteken</label>

    <input

      id="plate"

      placeholder="Bijv. 12-ABC-3"

      maxlength="10"

      autocomplete="off"

    >

    <button

      class="start"

      onclick="startJob()">

      ▶ Start werkzaamheden

    </button>

  </div>

  <div class="card">

    <h2>Actieve werkzaamheden</h2>

    <div id="activeJobs">

      <div class="empty">

        Geen actieve werkzaamheden.

      </div>

    </div>

  </div>

  <div class="card">

    <h2>Vandaag</h2>

    <div id="today">

      <div class="empty">

        Nog geen geregistreerde tijden.

      </div>

    </div>

  </div>

  <div class="card">

    <h2>Historie</h2>

    <div id="history">

      <div class="empty">

        Nog geen historie.

      </div>

    </div>

    <button

      class="secondary"

      onclick="clearHistory()">

      Historie wissen

    </button>

  </div>

</div>

<script>

const ACTIVE_KEY = "kentekenActief";

const HISTORY_KEY = "kentekenTijd";

let jobs =

  JSON.parse(

    localStorage.getItem(ACTIVE_KEY) || "[]"

  );

function formatTime(seconds){

  seconds =

    Math.max(

      0,

      Math.floor(seconds)

    );

  let h =

    Math.floor(

      seconds / 3600

    );

  let m =

    Math.floor(

      (seconds % 3600) / 60

    );

  let s =

    seconds % 60;

  return [h,m,s]

    .map(

      x => String(x).padStart(2,"0")

    )

    .join(":");

}

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

/* =========================

   KENTEKENPLAAT MAKEN

   ========================= */

function plateHtml(kenteken, extraClass=""){

  return `

    <div class="plate ${extraClass}">

      <div class="plate-nl">

        <div class="plate-eu">★</div>

        <div>NL</div>

      </div>

      <div class="plate-text">

        ${escapeHtml(kenteken)}

      </div>

    </div>

  `;

}

function saveJobs(){

  localStorage.setItem(

    ACTIVE_KEY,

    JSON.stringify(jobs)

  );

}

function getWorkedSeconds(job){

  const now =

    Date.now();

  let paused =

    job.totalPaused || 0;

  if(

    job.paused &&

    job.pauseStart

  ){

    paused +=

      Math.floor(

        (now - job.pauseStart) / 1000

      );

  }

  return Math.max(

    0,

    Math.floor(

      (now - job.startTime) / 1000

    ) - paused

  );

}

/* =========================

   NIEUW KENTEKEN STARTEN

   ========================= */

function startJob(){

  const input =

    document.getElementById("plate");

  const kenteken =

    input.value

      .trim()

      .toUpperCase();

  if(!kenteken){

    alert(

      "Vul eerst een kenteken in."

    );

    input.focus();

    return;

  }

  const alreadyActive =

    jobs.some(

      job =>

        job.kenteken === kenteken

    );

  if(alreadyActive){

    alert(

      "Dit kenteken is al actief."

    );

    return;

  }

  /*

    Er mag maar één timer tegelijk lopen.

    Daarom worden alle andere lopende

    werkzaamheden automatisch gepauzeerd.

  */

  jobs.forEach(job => {

    if(!job.paused){

      job.paused = true;

      job.pauseStart =

        Date.now();

    }

  });

  jobs.push({

    id:

      Date.now().toString() +

      Math.random()

        .toString(36)

        .slice(2),

    kenteken:kenteken,

    startTime:Date.now(),

    totalPaused:0,

    pauseStart:null,

    paused:false

  });

  saveJobs();

  input.value = "";

  render();

}

/* =========================

   PAUZEREN

   ========================= */

function pauseJob(id){

  const job =

    jobs.find(

      j => j.id === id

    );

  if(

    !job ||

    job.paused

  ){

    return;

  }

  job.paused = true;

  job.pauseStart =

    Date.now();

  saveJobs();

  render();

}

/* =========================

   HERVATTEN

   ========================= */

function resumeJob(id){

  const job =

    jobs.find(

      j => j.id === id

    );

  if(

    !job ||

    !job.paused

  ){

    return;

  }

  /*

    Er mag maar één timer tegelijk lopen.

    Daarom wordt ieder ander lopend

    kenteken automatisch gepauzeerd.

  */

  jobs.forEach(other => {

    if(

      other.id !== id &&

      !other.paused

    ){

      other.paused = true;

      other.pauseStart =

        Date.now();

    }

  });

  job.totalPaused +=

    Math.floor(

      (Date.now() - job.pauseStart) / 1000

    );

  job.pauseStart = null;

  job.paused = false;

  saveJobs();

  render();

}

/* =========================

   STOPPEN

   ========================= */

function stopJob(id){

  const index =

    jobs.findIndex(

      j => j.id === id

    );

  if(index === -1){

    return;

  }

  const job =

    jobs[index];

  const seconds =

    getWorkedSeconds(job);

  const endTime =

    Date.now();

  const record = {

    kenteken:

      job.kenteken,

    start:

      new Date(

        job.startTime

      ).toLocaleString(

        "nl-NL"

      ),

    eind:

      new Date(

        endTime

      ).toLocaleString(

        "nl-NL"

      ),

    seconden:

      seconds

  };

  let history =

    JSON.parse(

      localStorage.getItem(

        HISTORY_KEY

      ) || "[]"

    );

  history.unshift(record);

  localStorage.setItem(

    HISTORY_KEY,

    JSON.stringify(history)

  );

  jobs.splice(

    index,

    1

  );

  saveJobs();

  render();

}

/* =========================

   ACTIEVE WERKZAAMHEDEN

   ========================= */

function renderActiveJobs(){

  const container =

    document.getElementById(

      "activeJobs"

    );

  if(!jobs.length){

    container.innerHTML =

      '<div class="empty">' +

      'Geen actieve werkzaamheden.' +

      '</div>';

    return;

  }

  container.innerHTML =

    jobs.map(job => {

      const seconds =

        getWorkedSeconds(job);

      const status =

        job.paused

          ? "Werkzaamheden gepauzeerd"

          : "Werkzaamheden lopen";

      const button =

        job.paused

          ?

          `<button

             class="resume"

             onclick="resumeJob('${job.id}')">

             ▶ Hervatten

           </button>`

          :

          `<button

             class="pause"

             onclick="pauseJob('${job.id}')">

             ⏸ Pauzeren

           </button>`;

      return `

        <div class="job">

          ${plateHtml(

            job.kenteken,

            "active-plate"

          )}

          <div class="status">

            ${status}

          </div>

          <div class="timer">

            ${formatTime(seconds)}

          </div>

          <div class="job-buttons">

            ${button}

            <button

              class="stop"

              onclick="stopJob('${job.id}')">

              ■ Stop

            </button>

          </div>

        </div>

      `;

    }).join("");

}

/* =========================

   HISTORIE

   ========================= */

function showHistory(){

  const history =

    JSON.parse(

      localStorage.getItem(

        HISTORY_KEY

      ) || "[]"

    );

  const today =

    document.getElementById(

      "today"

    );

  const historyDiv =

    document.getElementById(

      "history"

    );

  if(!history.length){

    today.innerHTML =

      '<div class="empty">' +

      'Nog geen geregistreerde tijden.' +

      '</div>';

    historyDiv.innerHTML =

      '<div class="empty">' +

      'Nog geen historie.' +

      '</div>';

    return;

  }

  const vandaag =

    new Date()

      .toLocaleDateString(

        "nl-NL"

      );

  const todayRecords =

    history.filter(

      item =>

        item.start.startsWith(

          vandaag

        )

    );

  today.innerHTML =

    todayRecords.length

      ?

      todayRecords

        .map(item => `

          <div class="history-item">

            ${plateHtml(

              item.kenteken,

              "history-plate"

            )}

            <br>

            <b>

              ${formatTime(

                item.seconden

              )}

            </b>

            <div class="small">

              ${escapeHtml(

                item.start

              )}

            </div>

          </div>

        `)

        .join("")

      :

      '<div class="empty">' +

      'Vandaag nog geen tijden.' +

      '</div>';

  historyDiv.innerHTML =

    history

      .map(item => `

        <div class="history-item">

          ${plateHtml(

            item.kenteken,

            "history-plate"

          )}

          <br>

          <b>

            ${formatTime(

              item.seconden

            )}

          </b>

          <div class="small">

            ${escapeHtml(

              item.start

            )}

            <br>

            gestopt:

            ${escapeHtml(

              item.eind

            )}

          </div>

        </div>

      `)

      .join("");

}

/* =========================

   HISTORIE WISSEN

   ========================= */

function clearHistory(){

  if(

    confirm(

      "Alle geregistreerde tijden wissen?"

    )

  ){

    localStorage.removeItem(

      HISTORY_KEY

    );

    showHistory();

  }

}

/* =========================

   RENDER

   ========================= */

function render(){

  renderActiveJobs();

  showHistory();

}

setInterval(

  renderActiveJobs,

  1000

);

render();

</script>

</body>

</html>
